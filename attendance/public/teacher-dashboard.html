<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Teacher Dashboard</h1>
        <div id="timetable-section">
            <h2>Timetable</h2>
            <button id="add-timetable-btn" class="btn">Add Timetable</button>
            <div id="timetable-list"></div>
        </div>
        <div id="otp-section">
            <h2>Generate OTP</h2>
            <input type="date" id="otp-date" required>
            <button id="load-timetable-otp" class="btn">Load Timetable</button>
            <div id="daily-timetable-otp"></div>
            <div id="otp-display"></div>
        </div>
        <div id="view-attendance-section">
            <h2>View Attendance</h2>
            <input type="date" id="view-date" required>
            <button id="view-attendance-btn" class="btn">View Attendance</button>
            <div id="attendance-details"></div>
        </div>
        <button id="logout" class="btn">Logout</button>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
